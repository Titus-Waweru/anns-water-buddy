# /etc/nginx/sites-available/coop-proxy.conf
#
# Reverse proxy for Co-operative Bank OpenAPI.
# Exposes:
#   POST/GET https://wonderaqua.co.ke/coop/token       -> https://openapi.co-opbank.co.ke/token
#   POST     https://wonderaqua.co.ke/coop/FT/stk/1.0.0 -> https://openapi.co-opbank.co.ke/FT/stk/1.0.0
#
# All outbound traffic to Co-op leaves from the AWS Elastic IP (13.62.244.124),
# which is whitelisted at the bank. Supabase Edge Functions call THIS proxy
# instead of Co-op directly.

# Shared bank upstream — keep-alive for lower latency
upstream coop_bank {
    server openapi.co-opbank.co.ke:443;
    keepalive 8;
}

# Allow only the Supabase Edge runtime + the project itself.
# Replace <SUPABASE_PROJECT_REF> with your project ref. Leave 0.0.0.0/0 commented
# out unless you intend to expose the proxy publicly.
geo $coop_allowed {
    default 0;
    # Supabase Edge Functions egress (Frankfurt + Paris pools)
    3.0.0.0/8        1;
    13.0.0.0/8       1;
    18.0.0.0/8       1;
    35.0.0.0/8       1;
    51.0.0.0/8       1;
    52.0.0.0/8       1;
    54.0.0.0/8       1;
    # Localhost (for curl smoke-tests from the AWS box itself)
    127.0.0.1/32     1;
}

server {
    listen 443 ssl http2;
    server_name wonderaqua.co.ke;

    # TLS — managed by certbot (see DEPLOY.md)
    ssl_certificate     /etc/letsencrypt/live/wonderaqua.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wonderaqua.co.ke/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Hard limits — STK payloads are tiny
    client_max_body_size 16k;
    client_body_timeout  10s;
    send_timeout         15s;

    # Structured access log for correlation tracing
    log_format coop_json escape=json
        '{'
            '"ts":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"upstream_status":"$upstream_status",'
            '"upstream_time":"$upstream_response_time",'
            '"correlation_id":"$http_x_correlation_id",'
            '"bytes_sent":$bytes_sent,'
            '"ua":"$http_user_agent"'
        '}';
    access_log /var/log/nginx/coop-proxy.access.log coop_json;
    error_log  /var/log/nginx/coop-proxy.error.log warn;

    # Lock the proxy down to expected callers
    location /coop/ {
        if ($coop_allowed = 0) { return 403; }

        # Rewrite /coop/<path> -> /<path> upstream
        rewrite ^/coop/(.*)$ /$1 break;

        # Force HTTPS + correct SNI/Host so Akamai accepts the request
        proxy_pass                 https://coop_bank;
        proxy_ssl_server_name      on;
        proxy_ssl_name             openapi.co-opbank.co.ke;
        proxy_set_header Host      openapi.co-opbank.co.ke;
        proxy_http_version         1.1;
        proxy_set_header Connection "";

        # Preserve client context for bank-side logs
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header User-Agent       $http_user_agent;
        proxy_pass_request_headers on;

        # Timeouts tuned for STK push
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    30s;

        # Never let nginx swallow upstream errors — bubble them up verbatim
        proxy_intercept_errors off;

        # Echo the bank IP we resolved + our egress IP for diagnostics
        add_header X-Proxy-Egress-Ip "13.62.244.124" always;
        add_header X-Proxy-Upstream  "openapi.co-opbank.co.ke" always;
    }

    # Lightweight health probe for the verification endpoint
    location = /coop/_health {
        default_type application/json;
        return 200 '{"ok":true,"egress_ip":"13.62.244.124","upstream":"openapi.co-opbank.co.ke"}';
    }

    location / { return 404; }
}

# Redirect plain HTTP
server {
    listen 80;
    server_name wonderaqua.co.ke;
    return 301 https://$host$request_uri;
}
